<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">

  <title>Frontend Mentor | Browser extensions manager UI</title>
  <meta name="description"
    content="A browser extensions manager UI designed to showcase a list of extensions with toggle functionality.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link href="./src/output.css" rel="stylesheet">

</head>

<body class="bg-[#EBF4FD] px-[5rem] transition-colors duration-300">
  <header class="w-full py-5">
    <nav class="flex flex-row bg-white justify-around items-center w-full mx-auto rounded-3xl py-3">
      <img src="./assets/images/logo.svg" alt="Logo" class="logo">

      <div>
        <a href="#theme-toggle" class="toggle-btn"><img src="./assets/images/icon-moon.svg" alt="Moon Icon"></a>
      </div>
    </nav>
  </header>
  <main class="w-full h-screen">
    <div class="flex lg:flex-row justify-around md:flex-col sm:flex-col sm:items-center">
      <h2 class="text-2xl font-bold heading">Extension List</h2>

      <div class="flex flex-row justify-center gap-5">
        <a href="#all" class="bg-[#C6241A] rounded-full text-white px-4 py-1">All</a>
        <a href="#active" class="bg-white rounded-full px-4 py-1">Active</a>
        <a href="#inactive" class="bg-white rounded-full px-4 py-1">Inactive</a>
      </div>
    </div>

    <section id="card-container"
      class="grid grid-rows-4 grid-cols-3 gap-[2rem] mt-10 md:grid-cols-2 sm:grid-cols-1 lg:grid-cols-3">
      <figure class="bg-white rounded-3xl p-5 shadow-lg mb-5 w-fit h-[100%] flex justify-center flex-col card">
        <div class="flex gap-5 justify-around me-5 ">
          <div>
            <img src="./assets/images/logo-devlens.svg" alt="dev lens" class="w-25">
          </div>
          <div class="mb-5 mx-4">
            <h3 class="text-2xl font-bold">DevLens</h3>
            <p>Quickly inspect page layouts and visualize element boundaries.
            </p>

          </div>
        </div>
        <div class="flex justify-between items-center mt-5">
          <a href="#" class="bg-[#EBF4FD] px-5 py-1 rounded-full hover:bg-[#C6241A] hover:text-white remove">Remove</a>
          <label class="relative inline-flex items-center cursor-pointer">
            <input type="checkbox" value="" class="sr-only peer">
            <div
              class="w-11 h-6 bg-gray-300 rounded-full peer peer-checked:bg-[#C6241A] peer-focus:ring-2 ring-blue-500 transition-all duration-300 toggler">
            </div>
            <div
              class="absolute left-1 top-1 w-4 h-4 bg-white rounded-full transition-all duration-300 peer-checked:translate-x-full toggler-2">
            </div>
          </label>

        </div>

      </figure>



    </section>

  </main>
  <script src="./script.js"></script>
</body>

</html>
