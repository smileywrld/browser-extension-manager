<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link href="./src/output.css" rel="stylesheet">
</head>

<body class="dark:bg-[#050B21] bg-[#EBF4FD] px-[5rem]">
  <header class="w-full py-5">
    <nav class="flex flex-row bg-white justify-around items-center w-full mx-auto rounded-3xl py-3">
      <img src="./assets/images/logo.svg" alt="Logo" class="logo">

      <div><img src="./assets/images/icon-moon.svg" alt="Moon Icon"></div>
    </nav>
  </header>
  <main class="w-full h-screen">
    <div class="flex lg:flex-row justify-around md:flex-col sm:flex-col sm:items-center">
      <h2 class="text-2xl font-bold">Extension List</h2>

      <div class="flex flex-row justify-center gap-5">
        <a href="#all" class="bg-[#C6241A] rounded-full text-white px-4 py-1">All</a>
        <a href="#active" class="bg-white rounded-full px-4 py-1">Active</a>
        <a href="#inactive" class="bg-white rounded-full px-4 py-1">Inactive</a>
      </div>
    </div>

    <section id="card-container" class="grid grid-rows-4">
      <figure class="bg-white rounded-3xl p-5 shadow-lg mb-5 w-fit h-fit">
        <div class="flex gap-5 justify-center me-5">
          <div>
            <img src="./assets/images/logo-devlens.svg" alt="dev lens">
          </div>
          <div class="mb-5 mx-4">
            <h3 class="text-2xl font-bold">DevLens</h3>
            <p>Quickly inspect page layouts and visualize element boundaries.
              Remove</p>

          </div>
        </div>
        <div class="" id="toggle-btn">
          <a href="#">Remove</a>
         <label class="relative inline-flex items-center cursor-pointer">
  <input type="checkbox" value="" class="sr-only peer">
  <div class="w-11 h-6 bg-gray-300 rounded-full peer peer-checked:bg-blue-600 peer-focus:ring-2 ring-blue-500 transition-all duration-300"></div>
  <div class="absolute left-1 top-1 w-4 h-4 bg-white rounded-full transition-all duration-300 peer-checked:translate-x-full"></div>
</label>
        </div>

      </figure>
    </section>

  </main>
</body>

</html>
